name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app (Simulator + unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: List schemes
        run: xcodebuild -list -project ZhiTu.xcodeproj

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ZhiTu.xcodeproj \
            -scheme ZhiTu \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee build/simulator-build.log

      - name: Package simulator app
        if: success()
        run: |
          mkdir -p build/artifacts
          APP_PATH="build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/ZhiTu.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/artifacts/ZhiTu-Simulator.app.zip

      - name: Build for physical iPhone (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ZhiTu.xcodeproj \
            -scheme ZhiTu \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build | tee build/iphoneos-build.log

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DeviceDerivedData/Build/Products/Debug-iphoneos/ZhiTu.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload build/artifacts
          ditto "$APP_PATH" build/ipa/Payload/ZhiTu.app
          cd build/ipa
          /usr/bin/zip -qry ../artifacts/ZhiTu-unsigned.ipa Payload
          test -s ../artifacts/ZhiTu-unsigned.ipa
          echo "Created unsigned IPA:"
          ls -lh ../artifacts/ZhiTu-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/ZhiTu.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/ZhiTu.app/Info.plist || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZhiTu-Unsigned-IPA
          path: build/artifacts/ZhiTu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZhiTu-iOS-Simulator-App
          path: build/artifacts/ZhiTu-Simulator.app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZhiTu-build-logs
          path: |
            build/simulator-build.log
            build/iphoneos-build.log
          if-no-files-found: ignore
          retention-days: 14
